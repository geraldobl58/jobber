spring.application.name=jobber

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/jobber_db
spring.datasource.username=jobber
spring.datasource.password=jobber123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

security.token.secret=your-secret-key
security.token.secret.candidate=your-candidate-secret-key